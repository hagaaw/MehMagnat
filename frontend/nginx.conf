events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 10m;

    # Сжатие текстовых ресурсов (js, css, json, svg)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;

    # Корректная обработка заголовка Upgrade (только если клиент его прислал)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream spring_app {
        server app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # ---------- Бэкенд (Spring Boot) ----------
        # Проксируем только то, что реально есть в API:
        #   /api/**, /csrf, /login, /logout
        # ВАЖНО: страница входа во фронтенде живёт по адресу /signin,
        # а не /login, иначе она конфликтовала бы с POST /login бэкенда.
        location ~ ^/(api(/|$)|csrf$|login$|logout$) {
            proxy_pass http://spring_app;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ---------- Статика с хэшем в имени: кэшируем надолго ----------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---------- SPA: любые остальные адреса отдают index.html ----------
        # (/, /products/catalog, /reservations/search и т.д. обрабатывает React Router)
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
