name: mehmagnat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      password_admin: ${password_admin:-admin123}
      phone_admin: ${phone_admin:-+70000000000}
      email_admin: ${email_admin:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  # Фронтенд (React) + nginx в одном контейнере:
  # образ собирается из ./frontend/Dockerfile, конфиг nginx уже внутри образа.
  nginx:
    build: ./frontend
    ports:
      - "80:80"
    depends_on: [app]
    networks: [backend]
    restart: unless-stopped

networks:
  backend:

volumes:
  pgdata:
